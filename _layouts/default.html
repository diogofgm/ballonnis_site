<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ site.title }} | {{ page.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    {% assign t = site.data.ui[page.lang] %}
    
    <nav class="navbar">
        <div class="logo"><img src="/assets/images/ballonnis-name.png" alt="Ballonni's Pizza"/></div>
        <div class="nav-links">
            <a href="{{ page.lang == 'pt' | iif: '/', '/en/' }}#menu">{{ t.menu }}</a>
            <a href="{{ page.lang == 'pt' | iif: '/workshops', '/en/workshops' }}">{{ t.workshops }}</a>
            <a href="{{ page.lang == 'pt' | iif: '/events', '/en/events' }}">{{ t.events }}</a>
        </div>
        <div class="lang-switch">
            <a href="/" class="{% if page.lang == 'pt' %}active{% endif %}">PT</a> | 
            <a href="/en/" class="{% if page.lang == 'en' %}active{% endif %}">EN</a>
        </div>
    </nav>

    <main>
        {{ content }}
    </main>

    <footer>
        <div class="footer-content">
            <h3>{{ t.book_now }}</h3>
            <p>📞 925 410 763 (Chamada ou Whatsapp)</p>
            <p>🌐 ballonnis.com | 📸 @ballonnis</p>
            <p class="tagline">Pizzas Artesanais • {{ t.ingredients }} • {{ t.experiences }}</p>
        </div>
    </footer>
</body>
</html>
